<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #0E2E1A;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Field stripe pattern */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      180deg,
      transparent 0px,
      transparent 31px,
      rgba(255,255,255,0.03) 31px,
      rgba(255,255,255,0.03) 63px
    );
  }

  /* Green glow */
  body::after {
    content: "";
    position: absolute;
    left: -200px;
    top: -100px;
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(46,125,79,0.25) 0%, transparent 70%);
  }

  .card {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 80px;
    padding: 0 100px;
    width: 100%;
  }

  .left {
    flex: 1;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 32px;
  }

  .logo-mark {
    width: 52px;
    height: 52px;
    background: #1A4D2E;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255,255,255,0.12);
  }

  .logo-mark svg {
    width: 28px;
    height: 28px;
  }

  .logo-text {
    font-size: 32px;
    font-weight: 700;
    color: #FBF9F2;
    letter-spacing: -0.03em;
    position: relative;
  }

  .logo-dot {
    position: absolute;
    top: 6px;
    left: 12px;
    width: 5px;
    height: 5px;
    background: #C9A227;
    border-radius: 50%;
  }

  h1 {
    font-size: 64px;
    font-weight: 700;
    color: #FBF9F2;
    letter-spacing: -0.04em;
    line-height: 1.0;
    margin-bottom: 20px;
  }

  h1 span {
    color: #C9A227;
  }

  p {
    font-size: 22px;
    color: #7DB28F;
    line-height: 1.45;
    max-width: 520px;
  }

  .right {
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex-shrink: 0;
  }

  .stat {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px 28px;
    min-width: 220px;
  }

  .stat-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #4F9268;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .stat-value {
    font-size: 32px;
    font-weight: 700;
    color: #FBF9F2;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .stat-value .currency {
    font-size: 18px;
    color: #4F9268;
    margin-right: 4px;
  }

  .stat.highlight {
    background: #1A4D2E;
    border-color: rgba(201,162,39,0.3);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="left">
      <div class="logo-row">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#7DB28F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/>
          </svg>
        </div>
        <div class="logo-text">
          súmula
          <span class="logo-dot"></span>
        </div>
      </div>
      <h1>O caixa do<br>time, <span>organizado.</span></h1>
      <p>Mensalidades, despesas e prestação de contas — sem planilha.</p>
    </div>

    <div class="right">
      <div class="stat highlight">
        <div class="stat-label">Saldo do mês</div>
        <div class="stat-value"><span class="currency">R$</span>5.320</div>
      </div>
      <div class="stat">
        <div class="stat-label">Recebido</div>
        <div class="stat-value"><span class="currency">R$</span>9.000</div>
      </div>
      <div class="stat">
        <div class="stat-label">Mensalistas</div>
        <div class="stat-value">+1.200</div>
      </div>
    </div>
  </div>
</body>
</html>
